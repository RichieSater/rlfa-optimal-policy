name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  exact-certificate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --editable '.[test]'
      - name: Lint
        run: ruff check .
      - name: Test and verify certificate
        run: |
          pytest
          python -m rlfa_optimal_policy verify
