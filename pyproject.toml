[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rlfa-optimal-policy"
version = "0.4.0"
description = "Sharp review and cost bounds with certified-uncertainty policies for financial audits"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Richie Sater", email = "15129476+RichieSater@users.noreply.github.com" },
]
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.scripts]
rlfa-optimal = "rlfa_optimal_policy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
